name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión sin la v (ej. 1.4.2)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v4
uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17
uses: android-actions/setup-android@v3
run: sdkmanager "build-tools;35.0.0" > /dev/null

      
name: Versión y código
      id: v
      run: |
        VER="${{ github.event.inputs.version || github.ref_name }}"
        VER="${VER#v}"
        echo "ver=$VER" >> "$GITHUB_OUTPUT"
        echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
name: Inyectar versión
      run: |
        F=src/es/picazor/build.gradle.kts
        sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ steps.v.outputs.code }}/" "$F"
        sed -i -E "s/versionName = "[^"]+"/versionName = "${{ steps.v.outputs.ver }}"/" "$F"

      
run: ./gradlew :src:es/picazor:assembleRelease -x lint -x ktlintCheck

      
name: Firmar y nombrar
      env:
        KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
        APK=$(ls src/es/picazor/build/outputs/apk/release/.apk | head -n1)
        BT=$(ls -d "$ANDROID_HOME"/build-tools/ | sort -V | tail -n1)"$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/a.apk""$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass "pass:$KS_PASS" \--ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \--out "$RUNNER_TEMP/picazor-v${{ steps.v.outputs.ver }}.apk" "$RUNNER_TEMP/a.apk"

      
name: Generar índice
      run: |
        mkdir -p "$RUNNER_TEMP/site"
        cp "$RUNNER_TEMP/picazor-v${{ steps.v.outputs.ver }}.apk" "$RUNNER_TEMP/site/"
        cat > "$RUNNER_TEMP/site/index.min.json" <<'JSON'
[{"name":"Picazor","pkg":"eu.kanade.tachiyomi.extension.es.picazor","apk":"APKNAME","lang":"es","code":CODE,"version":"VER","nsfw":1,"sources":[{"name":"Picazor","lang":"es","id":"1086350406","baseUrl":"https://picazor.com"}]}]
          JSON
          sed -i "s/APKNAME/picazor-v${{ steps.v.outputs.ver }}.apk/" "$RUNNER_TEMP/site/index.min.json"
          sed -i "s/CODE/${{ steps.v.outputs.code }}/" "$RUNNER_TEMP/site/index.min.json"
          sed -i "s/VER/${{ steps.v.outputs.ver }}/" "$RUNNER_TEMP/site/index.min.json"
          cp "$RUNNER_TEMP/site/index.min.json" "$RUNNER_TEMP/site/index.json"

      
name: Publicar en gh-pages
      run: |
        cd "$RUNNER_TEMP/site"
        git init -q
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -qb gh-pages
        git add -A
        git commit -qm "Picazor v${{ steps.v.outputs.ver }}"
        git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git push -f origin gh-pages

      
name: Release con el APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.v.outputs.ver }}
        files: ${{ runner.temp }}/picazor-v${{ steps.v.outputs.ver }}.apk
