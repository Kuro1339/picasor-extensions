name: Build (prueba)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v4
uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17
uses: android-actions/setup-android@v3
run: sdkmanager "build-tools;35.0.0" > /dev/null
run: ./gradlew :src:es:picazor:assembleDebug -x lint -x ktlintCheck
name: Firmar
env:
  KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
  KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
  ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASS: ${{ secrets.KEY_PASSWORD }}
run: |
  echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
  APK=$(ls src/es/picazor/build/outputs/apk/debug/.apk | head -n1)
  BT=$(ls -d "$ANDROID_HOME"/build-tools/ | sort -V | tail -n1)"$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/a.apk""$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass "pass:$KS_PASS" \--ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \--out "$RUNNER_TEMP/picazor.apk" "$RUNNER_TEMP/a.apk"
uses: actions/upload-artifact@v4
with:
  name: picazor-apk
  path: ${{ runner.temp }}/picazor.apk
